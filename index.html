<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>홍낙순 사료 인과관계 인터랙티브 그래프</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- D3.js v7 for Interactive Force Graph -->
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <style>
        .link { stroke: #cbd5e1; stroke-width: 2px; stroke-dasharray: 4; animation: dash 20s linear infinite; }
        @keyframes dash { to { stroke-dashoffset: -100; } }
        .node { cursor: pointer; }
        .node circle { transition: all 0.2s ease; }
        .node:hover circle { filter: drop-shadow(0 4px 6px rgba(0,0,0,0.15)); }
        svg { background-color: #f8fafc; border-radius: 1rem; }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 font-sans antialiased min-h-screen p-4 md:p-8">

    <div class="max-w-6xl mx-auto space-y-6">
        <!-- Header -->
        <header class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
            <div>
                <span class="bg-indigo-100 text-indigo-800 text-xs px-3 py-1 rounded-full font-semibold uppercase tracking-wider">조선왕조실록 인과관계 분석</span>
                <h1 class="text-2xl font-bold text-slate-900 mt-1">우의정 홍낙순 인사 파동 인과 네트워크</h1>
                <p class="text-slate-500 text-sm mt-0.5">노드를 마우스로 끌어당기거나 클릭하여 연쇄적 인과 흐름과 상세 사료 원문을 확인하세요.</p>
            </div>
            <div class="flex gap-2">
                <button id="resetBtn" class="px-4 py-2 bg-slate-200 hover:bg-slate-300 text-slate-700 text-sm font-semibold rounded-xl transition">그래프 정렬</button>
            </div>
        </header>

        <!-- Main Workspace: Graph & Details Panel -->
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
            
            <!-- Graph Container (2 Cols) -->
            <div class="lg:col-span-2 bg-white p-4 rounded-2xl shadow-sm border border-slate-200 relative">
                <div id="graph-container" class="w-full h-[500px] flex items-center justify-center"></div>
                <div class="absolute bottom-6 left-6 bg-white/90 backdrop-blur px-3 py-2 rounded-lg border border-slate-200 text-xs text-slate-500 space-y-1 shadow-sm pointer-events-none">
                    <div class="flex items-center gap-2"><span class="w-3 h-3 rounded-full bg-blue-500 inline-block"></span> 원인 (동기 및 실무 착오)</div>
                    <div class="flex items-center gap-2"><span class="w-3 h-3 rounded-full bg-amber-500 inline-block"></span> 결과 (행정 집행 및 탄핵)</div>
                    <div class="flex items-center gap-2"><span class="w-3 h-3 rounded-full bg-purple-500 inline-block"></span> 정치적 반응 (자책 상소)</div>
                    <div class="flex items-center gap-2"><span class="w-3 h-3 rounded-full bg-rose-500 inline-block"></span> 최종 수습 (국왕의 비답)</div>
                </div>
            </div>

            <!-- Detail Info Panel (1 Col) -->
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 flex flex-col justify-between">
                <div>
                    <div class="flex items-center justify-between mb-4">
                        <span id="detail-category" class="text-xs px-2.5 py-1 rounded-md font-bold bg-slate-100 text-slate-700">노드를 선택하세요</span>
                        <span id="detail-actor" class="text-xs font-semibold text-slate-400">주체: -</span>
                    </div>
                    <h2 id="detail-title" class="text-xl font-bold text-slate-900 mb-2">사건을 클릭하세요</h2>
                    <p id="detail-summary" class="text-sm text-slate-600 mb-6 leading-relaxed">왼쪽 그래프에서 원하는 사건 노드를 클릭하시면 해당 단계의 인과관계 설명과 실록 원문 인용구가 여기에 표시됩니다.</p>
                </div>
                
                <div class="bg-slate-50 p-4 rounded-xl border border-slate-200">
                    <span class="text-xs font-bold text-slate-400 uppercase tracking-wider block mb-1">실록 원문 인용</span>
                    <p id="detail-quote" class="text-xs text-slate-700 italic">"-"</p>
                </div>
            </div>

        </div>
    </div>

    <!-- D3 Interactive Logic Script -->
    <script>
        const nodes = [
            { id: "n1", step: 1, actor: "우의정 홍낙순", title: "1. 유자 천거 의도", category: "원인 (동기)", color: "#3b82f6", summary: "초연(경연)에서 국가를 위해 인재(유자)를 등용하고자 순수한 의도로 아룀.", quote: "신이 초연에서 아뢴 것은 오로지 국가를 위하여 유자를 천거하려는 데에서 나온 것인데" },
            { id: "n2", step: 2, actor: "정리(아전) & 홍낙순", title: "2. 격례 문의 및 오인", category: "원인 (실무 착오)", color: "#3b82f6", summary: "실무 아전(정리)에게 전례를 물은 뒤, 초사자 계하가 가능하다고 판단하여 격례대로 행하라 지시함.", quote: "정리에게 격례를 물었더니 우선 초사하는 자는 다 계하할 수 있다고 하므로... 격례를 살펴서 행하라고 말하였습니다." },
            { id: "n3", step: 3, actor: "전조 (이조)", title: "3. 지례 강관 부직", category: "결과 (행정 집행)", color: "#f59e0b", summary: "전조(이조)가 우의정 홍낙순의 말을 근거로 삼아 지례 강관을 실제 관직에 임명함.", quote: "이제 전조에서 신의 말을 주로 삼아 지례 강관을 부직하였는데" },
            { id: "n4", step: 4, actor: "옥당 (홍문관)", title: "4. 탄핵 및 중추 상소", category: "결과 (언론 반발)", color: "#f59e0b", summary: "옥당이 인사 절차(격례) 위반을 지적하며 전조를 공박하고 홍낙순에 대한 중한 처벌(중추)을 청함.", quote: "옥당의 상소에 중추를 청하기까지 하였으니" },
            { id: "n5", step: 5, actor: "우의정 홍낙순", title: "5. 자책 차자 및 사직 청원", category: "정치적 반응", color: "#8b5cf6", summary: "전조의 잘못이 아니라 지시를 내린 자신의 잘못이라며 처분과 퇴사(사직)를 청하는 차자를 올림.", quote: "이것은 전조의 잘못이 아니라 바로 신의 잘못입니다. 처분을 내리소서." },
            { id: "n6", step: 6, actor: "국왕", title: "6. 비답 및 사직 반려", category: "최종 수습", color: "#f43f5e", summary: "국왕이 선비 천거의 순수한 뜻을 인정하고, 행정 착오는 실무 부서(유사)의 몫이라며 사직을 만류함.", quote: "경이 초연에서 아뢴 것은 뜻이 선비를 천거하는 데에 있었고... 안심하고 다시는 퇴사하지 말라." }
        ];

        const links = [
            { source: "n1", target: "n2", label: "실행 절차 확인" },
            { source: "n2", target: "n3", label: "지시 하달 → 인사" },
            { source: "n3", target: "n4", label: "규정 위반 지적" },
            { source: "n4", target: "n5", label: "책임 추궁 → 자책" },
            { source: "n5", target: "n6", label: "사직 청원 → 국왕" },
            { source: "n1", target: "n6", label: "근본 선의 인정", dashed: true }
        ];

        const width = document.getElementById('graph-container').clientWidth || 700;
        const height = 500;

        const svg = d3.select("#graph-container")
            .append("svg")
            .attr("width", width)
            .attr("height", height)
            .attr("viewBox", [0, 0, width, height]);

        const simulation = d3.forceSimulation(nodes)
            .force("link", d3.forceLink(links).id(d => d.id).distance(110))
            .force("charge", d3.forceManyBody().strength(-400))
            .force("center", d3.forceCenter(width / 2, height / 2))
            .force("collision", d3.forceCollide().radius(45));

        // Draw links
        const link = svg.append("g")
            .selectAll("line")
            .data(links)
            .join("line")
            .attr("class", "link")
            .attr("stroke", d => d.dashed ? "#94a3b8" : "#cbd5e1")
            .attr("stroke-dasharray", d => d.dashed ? "4,4" : "none")
            .attr("stroke-width", 2);

        // Draw link labels
        const linkText = svg.append("g")
            .selectAll("text")
            .data(links)
            .join("text")
            .attr("class", "text-xs fill-slate-400 font-medium")
            .text(d => d.label);

        // Draw nodes
        const node = svg.append("g")
            .selectAll("g")
            .data(nodes)
            .join("g")
            .attr("class", "node")
            .call(d3.drag()
                .on("start", dragstarted)
                .on("drag", dragged)
                .on("end", dragended));

        node.append("circle")
            .attr("r", 26)
            .attr("fill", d => d.color)
            .attr("stroke", "#ffffff")
            .attr("stroke-width", 3);

        node.append("text")
            .attr("dy", 42)
            .attr("text-anchor", "middle")
            .attr("class", "text-xs font-bold fill-slate-700")
            .text(d => `Step ${d.step}`);

        node.append("text")
            .attr("dy", -35)
            .attr("text-anchor", "middle")
            .attr("class", "text-xs font-semibold fill-slate-500")
            .text(d => d.actor);

        // Node click event to show details
        node.on("click", (event, d) => {
            document.getElementById("detail-category").innerText = d.category;
            document.getElementById("detail-actor").innerText = `주체: ${d.actor}`;
            document.getElementById("detail-title").innerText = d.title;
            document.getElementById("detail-summary").innerText = d.summary;
            document.getElementById("detail-quote").innerText = `"${d.quote}"`;

            // Highlight active node
            node.select("circle").attr("stroke", "#ffffff").attr("stroke-width", 3);
            d3.select(event.currentTarget).select("circle").attr("stroke", "#0f172a").attr("stroke-width", 4);
        });

        simulation.on("tick", () => {
            link
                .attr("x1", d => d.source.x)
                .attr("y1", d => d.source.y)
                .attr("x2", d => d.target.x)
                .attr("y2", d => d.target.y);

            linkText
                .attr("x", d => (d.source.x + d.target.x) / 2)
                .attr("y", d => (d.source.y + d.target.y) / 2 - 5);

            node
                .attr("transform", d => `translate(${d.x}, ${d.y})`);
        });

        function dragstarted(event, d) {
            if (!event.active) simulation.alphaTarget(0.3).restart();
            d.fx = d.x;
            d.fy = d.y;
        }

        function dragged(event, d) {
            d.fx = event.x;
            d.fy = event.y;
        }

        function dragended(event, d) {
            if (!event.active) simulation.alphaTarget(0);
            d.fx = null;
            d.fy = null;
        }

        document.getElementById("resetBtn").addEventListener("click", () => {
            simulation.alpha(1).restart();
        });

        // Select first node by default on load
        setTimeout(() => {
            node.nodes()[0].dispatchEvent(new MouseEvent('click', { bubbles: true }));
        }, 300);
    </script>

</body>
</html>
